model:
  architecture: faster_rcnn_resnet50_fpn
  num_classes: 6
  # Path B: 320x320 for matched comparison; 224x224 for low-res comparison; 256x256 optional ablation.
  # Accuracy-oriented reference model; not automatically assumed to meet the 100 ms CPU target.
  input_size: [320, 320]
  resolution_group: matched_320
  role: accuracy_reference
  pretrained: true
  trainable_backbone_layers: 3
  provenance:
    library: torchvision
    weights_enum: FasterRCNN_ResNet50_FPN_Weights.DEFAULT
    licence: BSD-3-Clause

training:
  seed: 42
  epochs: 35
  batch_size: 8
  num_workers: 2
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 2
  early_stopping_patience: 8
  grad_clip_norm: 10.0
  amp: true
  resume_from: null

augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.2
  max_rotation_deg: 5.0
  rotation_prob: 0.3
  brightness_delta: 0.15
  contrast_range: [0.85, 1.15]
  gaussian_noise_std: 5.0
  gaussian_blur_prob: 0.15

postprocessing:
  score_threshold_pre_nms: 0.05
  nms_iou_threshold: 0.45
  max_detections: 100
  class_aware_nms: true

onnx:
  opset_version: 17
  batch_size: 1
