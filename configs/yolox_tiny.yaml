model:
  architecture: yolox_tiny
  num_classes: 6
  # Path B: 320x320 for matched three-model comparison; 224x224 for two-model low-res comparison; 256x256 optional ablation.
  input_size: [320, 320]
  resolution_group: matched_320
  depth_multiple: 0.33
  width_multiple: 0.375
  strides: [8, 16, 32]
  pretrained: true
  pretrained_checkpoint: null
  provenance:
    upstream_repo: https://github.com/Megvii-BaseDetection/YOLOX
    upstream_default_input_size: [416, 416]
    repo_licence: Apache-2.0
    checkpoint_url: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.pth
    checkpoint_sha256: pending_verification
    checkpoint_licence_status: pending_verification
    fallback_architecture: nanodet_plus_m
    fallback_repo: https://github.com/RangiLyu/nanodet
    fallback_licence: Apache-2.0

training:
  seed: 42
  epochs: 40
  batch_size: 16
  num_workers: 2
  optimizer: sgd
  lr: 0.0025
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  warmup_epochs: 3
  early_stopping_patience: 10
  grad_clip_norm: 10.0
  amp: true
  freeze_backbone_epochs: 0
  resume_from: null

augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.2
  max_rotation_deg: 5.0
  rotation_prob: 0.3
  brightness_delta: 0.15
  contrast_range: [0.85, 1.15]
  gaussian_noise_std: 5.0
  gaussian_blur_prob: 0.15

postprocessing:
  score_threshold_pre_nms: 0.05
  nms_iou_threshold: 0.45
  max_detections: 100
  class_aware_nms: true

onnx:
  opset_version: 17
  batch_size: 1
