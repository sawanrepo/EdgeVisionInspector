benchmark:
  batch_size: 1
  execution_provider: CPUExecutionProvider
  intra_op_num_threads: 4
  inter_op_num_threads: 1
  warmup_iterations: 50
  timed_iterations: 1000
  target_p95_end_to_end_ms: 100.0
  target_macro_recall: 0.90
  iou_threshold: 0.50
  bootstrap_replicates: 2000
  bootstrap_seed: 42
  operating_point_sweep_steps: 91
  operating_point_min_conf: 0.05
  operating_point_max_conf: 0.95
