# Canonical preprocessing contract shared across PyTorch training/eval, ONNX FP32, and ONNX INT8.
# Do not duplicate resize, scaling, normalization, or coordinate transforms in model or API code.

grayscale_to_rgb: true
channel_order: RGB
tensor_layout: NCHW
dtype: float32
bbox_format: xyxy

architectures:
  yolox_tiny:
    native_size: [200, 200]
    default_input_size: [320, 320]
    supported_input_sizes:
      - [224, 224]
      - [256, 256]
      - [320, 320]
    resize_mode: letterbox
    interpolation: bilinear
    pad_value: 114.0
    # YOLOX-Tiny operates on [0, 255] float32 intensities with unit normalization.
    # Grayscale-replicated channels have identical R, G, and B values.
    pixel_scale: 1.0
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

  ssdlite320_mobilenet_v3_large:
    native_size: [200, 200]
    default_input_size: [320, 320]
    supported_input_sizes:
      - [320, 320]
    resize_mode: direct
    interpolation: bilinear
    pad_value: 0.0
    # Torchvision MobileNetV3 SSDLite normalized to [-1, 1] via mean=0.5, std=0.5 on [0, 1] scaled inputs.
    pixel_scale: 0.00392156862745098
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]

  faster_rcnn_resnet50_fpn:
    native_size: [200, 200]
    default_input_size: [320, 320]
    supported_input_sizes:
      - [224, 224]
      - [256, 256]
      - [320, 320]
    resize_mode: direct
    interpolation: bilinear
    pad_value: 0.0
    # ImageNet mean/std normalization on [0, 1] scaled RGB inputs.
    pixel_scale: 0.00392156862745098
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
